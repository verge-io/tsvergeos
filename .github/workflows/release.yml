name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Create or update release PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          title: "chore: version packages"
          commit: "chore: version packages"
          commitMode: github-api
        env:
          # Use a dedicated PAT so the Version Packages PR is authored by a
          # user (not GITHUB_TOKEN) and thus triggers pull_request workflows.
          # Without this, required status checks never run on the release PR
          # and it becomes unmergeable under branch protection.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_GITHUB_TOKEN }}

      - name: Publish with npm trusted publishing
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release
