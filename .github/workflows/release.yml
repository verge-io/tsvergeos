name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Quality gate
        run: |
          pnpm --filter @vergeio/tsvergeos exec biome check src/ test/unit/
          pnpm --filter @vergeio/tsvergeos typecheck
          pnpm --filter @vergeio/tsvergeos build
          pnpm --filter @vergeio/tsvergeos test

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          publish: pnpm --filter @vergeio/tsvergeos publish --no-git-checks --provenance --access public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-publish verification
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "### Published packages" >> "$GITHUB_STEP_SUMMARY"
          sleep 15
          pkg_name=$(node -e "console.log(require('./packages/sdk/package.json').name)")
          pkg_version=$(node -e "console.log(require('./packages/sdk/package.json').version)")
          echo "Verifying ${pkg_name}@${pkg_version} on npm..."
          npm view "${pkg_name}@${pkg_version}" --json | tee /tmp/npm-view.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/npm-view.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Verify zero runtime deps in published package
          dep_count=$(node -e "const d=require('/tmp/npm-view.json'); console.log(Object.keys(d.dependencies||{}).length)")
          if [ "$dep_count" -ne 0 ]; then
            echo "::warning::Published package has ${dep_count} runtime dependencies"
          fi
          echo "### ${pkg_name}@${pkg_version} verified on npm registry" >> "$GITHUB_STEP_SUMMARY"
