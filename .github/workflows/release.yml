name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Check for pending changesets
        id: check
        run: |
          if pnpm changeset status 2>&1 | grep -q "No changesets present"; then
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          pnpm changeset version
          echo "new_version=$(node -e "console.log(require('./packages/sdk/package.json').version)")" >> "$GITHUB_OUTPUT"
        id: version

      - name: Quality gate
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          pnpm --filter @vergeio/tsvergeos exec biome check src/ test/unit/
          pnpm --filter @vergeio/tsvergeos typecheck
          pnpm --filter @vergeio/tsvergeos build
          pnpm --filter @vergeio/tsvergeos test

      - name: Publish to npm
        if: steps.check.outputs.has_changesets == 'true'
        run: pnpm --filter @vergeio/tsvergeos publish --no-git-checks --provenance --access public

      - name: Create GitHub Release
        if: steps.check.outputs.has_changesets == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v${{ steps.version.outputs.new_version }}"
          changelog=$(cat packages/sdk/CHANGELOG.md 2>/dev/null || echo "Initial release")
          gh release create "$version" \
            --title "$version" \
            --notes "$changelog" \
            --target main

      - name: Post-publish verification
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          echo "### Published packages" >> "$GITHUB_STEP_SUMMARY"
          sleep 15
          pkg_name=$(node -e "console.log(require('./packages/sdk/package.json').name)")
          pkg_version=$(node -e "console.log(require('./packages/sdk/package.json').version)")
          echo "Verifying ${pkg_name}@${pkg_version} on npm..."
          npm view "${pkg_name}@${pkg_version}" --json | tee /tmp/npm-view.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/npm-view.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          dep_count=$(node -e "const d=require('/tmp/npm-view.json'); console.log(Object.keys(d.dependencies||{}).length)")
          if [ "$dep_count" -ne 0 ]; then
            echo "::warning::Published package has ${dep_count} runtime dependencies"
          fi
          echo "### ${pkg_name}@${pkg_version} verified on npm registry" >> "$GITHUB_STEP_SUMMARY"
